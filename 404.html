<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in the box | Siddhartha Vasam</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0b; color: #ecebe6; }
    body { display: grid; place-items: center; font-family: "Instrument Serif", Georgia, serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; text-align: center; padding: 24px; }
    .code { font-family: Doto, monospace; font-weight: 800; font-size: clamp(90px, 22vw, 220px); line-height: 1; letter-spacing: .02em; }
    h1 { font-weight: 400; font-size: clamp(28px, 4vw, 48px); margin: 18px 0 10px; }
    h1 em { color: #a9a8a3; }
    p { font-family: "Geist Mono", monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6f6e6a; }
    a { display: inline-block; margin-top: 26px; padding: 14px 22px; border: 1px solid #ecebe638; border-radius: 99px; color: #ecebe6; text-decoration: none; font-family: "Geist Mono", monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    a:hover { border-color: #ff6a2b; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff6a2b; box-shadow: 0 0 12px #ff6a2b; margin-right: 10px; vertical-align: 1px; }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <main>
    <div class="code">404</div>
    <h1>This side of the box <em>is empty.</em></h1>
    <p>The page you were looking for isn't here.</p>
    <a href="./"><span class="dot"></span>Back to the portfolio</a>
  </main>
  <script>
    // drifting dust, so the 404 still feels like the rest of the site
    const c = document.getElementById("c"), g = c.getContext("2d"), d = Math.min(devicePixelRatio || 1, 2);
    let pts = [];
    function size() { c.width = innerWidth * d; c.height = innerHeight * d; g.setTransform(d, 0, 0, d, 0, 0); pts = Array.from({ length: Math.round(innerWidth * innerHeight / 900) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, v: 0.1 + Math.random() * 0.4, a: Math.random() * 0.5, p: Math.random() * 6 })); }
    size(); addEventListener("resize", size);
    (function loop(t) {
      g.clearRect(0, 0, innerWidth, innerHeight); g.fillStyle = "#ecebe6";
      for (const q of pts) { q.x -= q.v; q.y += q.v * 0.3; if (q.x < -2) q.x = innerWidth + 2; if (q.y > innerHeight + 2) q.y = -2; g.globalAlpha = q.a * (0.6 + 0.4 * Math.sin(t * 0.002 + q.p)); g.fillRect(q.x, q.y, 1.2, 1.2); }
      requestAnimationFrame(loop);
    })(0);
  </script>
</body>
</html>
